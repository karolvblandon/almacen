<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buscador Almacén Medrano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .shelf-level { border: 2px solid #e2e8f0; height: 45px; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; font-weight: 800; border-radius: 10px; background: #f8fafc; color: #94a3b8; transition: 0.3s; }
        .highlight { background-color: #f97316 !important; color: white !important; border-color: #ea580c !important; transform: scale(1.05); shadow: 0 4px 15px rgba(234, 88, 12, 0.4); }
        .header-gradient { background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="header-gradient p-6 rounded-b-[2.5rem] shadow-xl sticky top-0 z-50 text-center">
        <h1 class="text-white text-xs font-black uppercase tracking-widest mb-4">Buscador de Almacén - Medrano</h1>
        <div class="relative max-w-md mx-auto">
            <input type="text" id="searchInput" placeholder="Buscar por código o nombre..." class="w-full p-4 pl-12 rounded-2xl border-none focus:ring-4 focus:ring-orange-400 text-lg shadow-2xl">
            <i class="fa fa-search absolute left-4 top-5 text-slate-400"></i>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4">
        <div id="results" class="mt-2 space-y-3"></div>
        <div id="locationCard" class="hidden mt-4 bg-white p-6 rounded-[2rem] shadow-2xl border border-slate-100">
            <div class="flex justify-between items-start mb-6">
                <div class="w-10/12">
                    <span id="vFamilia" class="text-[10px] bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-bold uppercase"></span>
                    <h2 id="vNombre" class="text-lg font-black text-slate-800 mt-2 leading-tight"></h2>
                    <p id="vCodigo" class="text-orange-600 font-mono font-black text-md mt-1"></p>
                </div>
                <button onclick="closeCard()" class="text-slate-300"><i class="fa fa-times-circle text-3xl"></i></button>
            </div>
            <div class="grid grid-cols-3 gap-2 mb-8 text-center font-black">
                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                    <p class="text-[9px] uppercase text-slate-400">Pasillo</p><p id="vPasillo" class="text-xl text-blue-900"></p>
                </div>
                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                    <p class="text-[9px] uppercase text-slate-400">Sección</p><p id="vSeccion" class="text-xl text-blue-900"></p>
                </div>
                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                    <p class="text-[9px] uppercase text-slate-400">Estante</p><p id="vEstante" class="text-xl text-blue-900"></p>
                </div>
            </div>
            <div class="bg-slate-50 rounded-3xl p-6 border border-slate-100">
                <p class="text-center text-[10px] font-black text-slate-400 mb-6 uppercase tracking-widest italic">Nivel (Altura)</p>
                <div id="shelfVisual" class="flex flex-col-reverse">
                    <div class="shelf-level" data-level="5">NIVEL 5</div>
                    <div class="shelf-level" data-level="4">NIVEL 4</div>
                    <div class="shelf-level" data-level="3">NIVEL 3</div>
                    <div class="shelf-level" data-level="2">NIVEL 2</div>
                    <div class="shelf-level" data-level="1">NIVEL 1</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const datos = [
            { do:"121401", F:"TUBERIA", norte:"TUBO PVC PRESION RDE 21 1/2", pag:"01", s:"A", mi:1, a:1 },
            { do:"121402", F:"TUBERIA", norte:"TUBO PVC PRESION RDE 21 3/4", pag:"01", s:"A", mi:1, a:2 },
            { do:"121403", F:"TUBERIA", norte:"TUBO PVC PRESION RDE 21 1", pag:"01", s:"B", mi:2, a:1 },
            { do:"152010", F:"ACCESORIOS", norte:"CODO 90 PVC 1/2", pag:"05", s:"DO", mi:10, a:3 },
            { do:"181050", F:"VALVULAS", norte:"VALVULA BOLA 1/2", pag:"12", s:"A", mi:15, a:1 },
            { do:"201010", F:"HERRAMIENTA", norte:"LLAVE INGLÉS 8", pag:"22", s:"D", mi:22, a:5 },
            { do:"305090", F:"PEGA", norte:"LIMPIADOR PVC 1/4", pag:"40", s:"A", mi:40, a:3 },
            { do:"404010", F:"ELÉCTRICO", norte:"CABLE DÚPLEX 12", pag:"41", s:"B", mi:41, a:2 }
        ];

        const searchInput = document.getElementById('searchInput');
        const resultsDiv = document.getElementById('results');
        const locationCard = document.getElementById('locationCard');

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toUpperCase();
            if (val.length < 2) { resultsDiv.innerHTML = ''; locationCard.classList.add('hidden'); return; }
            const matches = datos.filter(i => i.do.includes(val) || i.norte.includes(val)).slice(0, 5);
            resultsDiv.innerHTML = matches.map(i => `
                <div onclick="showItem('${i.do}')" class="bg-white p-4 rounded-2xl shadow-sm border-l-[6px] border-blue-600 flex justify-between items-center">
                    <div><p class="text-[10px] font-black text-orange-500">${i.do}</p><p class="font-bold text-slate-800 text-xs">${i.norte}</p></div>
                    <i class="fa fa-chevron-right text-blue-200"></i>
                </div>`).join('');
        });

        function showItem(cod) {
            const i = datos.find(item => item.do === cod);
            document.getElementById('vFamilia').innerText = i.F;
            document.getElementById('vNombre').innerText = i.norte;
            document.getElementById('vCodigo').innerText = i.do;
            document.getElementById('vPasillo').innerText = i.pag;
            document.getElementById('vSeccion').innerText = i.s;
            document.getElementById('vEstante').innerText = i.mi;
            document.querySelectorAll('.shelf-level').forEach(el => el.classList.remove('highlight'));
            const level = document.querySelector(`[data-level="${i.a}"]`);
            if (level) level.classList.add('highlight');
            locationCard.classList.remove('hidden');
            resultsDiv.innerHTML = '';
            searchInput.value = '';
        }
        function closeCard() { locationCard.classList.add('hidden'); }
    </script>
</body>
</html>
